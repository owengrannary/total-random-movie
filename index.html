<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Total Random Movie</title><style>body{font-family:system-ui;background:#0b0b0d;color:#fff;max-width:720px;margin:0 auto;padding:32px 20px;text-align:center}button{font-size:1.25rem;font-weight:800;padding:18px 28px;border:0;border-radius:16px;cursor:pointer}.card{margin-top:28px;padding:24px;border:1px solid #333;border-radius:18px;background:#151518}.muted{color:#aaa}a{color:#8ab4ff}h1{font-size:2rem}</style></head><body><h1>🎲 Total Random Movie</h1><p class="muted" id="status">Loading the complete TMDB pool…</p><button id="roll" disabled>Loading…</button><div id="result"></div><script>
let movies=[];
async function load(){try{const r=await fetch('movies.json.gz');if(!r.ok)throw Error('HTTP '+r.status);const ds=new DecompressionStream('gzip');const text=await new Response(r.body.pipeThrough(ds)).text();movies=text.trim().split('\n').map(s=>JSON.parse(s));document.getElementById('status').textContent=movies.length.toLocaleString()+' unique TMDB movies loaded — regular + adult, zero filters.';const b=document.getElementById('roll');b.disabled=false;b.textContent='🎲 RANDOM MOVIE';}catch(e){document.getElementById('status').textContent='Could not load movie database: '+e.message;}}
function randIndex(n){const max=0x100000000, lim=max-(max%n), a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
document.getElementById('roll').onclick=()=>{const [id,adult,title]=movies[randIndex(movies.length)];document.getElementById('result').innerHTML='<div class="card"><h2>'+esc(title||'(Untitled)')+'</h2><p>TMDB ID: '+id+' · '+(adult?'🔞 Adult-tagged':'Standard movie')+'</p><p><a target="_blank" href="https://www.themoviedb.org/movie/'+id+'">Open on TMDB</a> · <a target="_blank" href="https://www.google.com/search?q='+encodeURIComponent((title||'')+' movie')+'">Search Google</a></p></div>'}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
